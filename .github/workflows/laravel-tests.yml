name: Laravel tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, curl, dom, fileinfo, mbstring, pdo_sqlite, sqlite3, tokenizer, xml
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare local environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch database/government_idss.sqlite

      - name: Run automated tests
        run: php artisan test
