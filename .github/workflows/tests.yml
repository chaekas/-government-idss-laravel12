name: Laravel tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify PHP and Composer container
        run: docker run --rm composer:2 php -v
      - name: Install dependencies with PHP and Composer
        run: docker run --rm -v "$GITHUB_WORKSPACE:/app" -w /app composer:2 composer install --no-interaction --prefer-dist
      - name: Validate Composer configuration
        run: docker run --rm -v "$GITHUB_WORKSPACE:/app" -w /app composer:2 composer validate --no-check-publish
      - name: Run tests using SQLite
        run: docker run --rm -v "$GITHUB_WORKSPACE:/app" -w /app composer:2 php artisan test
