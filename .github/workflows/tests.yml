name: Laravel tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathieu/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite, pdo_sqlite, bcmath, dom, fileinfo, tokenizer, xml, ctype, curl
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Validate Composer configuration
        run: composer validate --no-check-publish
      - name: Run tests
        run: php artisan test
